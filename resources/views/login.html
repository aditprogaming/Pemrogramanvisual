<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #3b4293; /* Warna latar belakang luar */
            margin-top: 100px;
        }

        h2 {
            color: black;
            background-color: #2299aa;
            display:inline-block;
            padding:20px;
            border-radius: 10px;
        }

        .login-box {
            background-color: #2299aa; /* Warna latar belakang tengah */
            padding: 30px;
            display: inline-block;
            border-radius: 10px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        /* Solusi untuk area password */
        .password-area {
            background-color:#2299aa ; /* Background khusus area password */
            display: inline-block;  /* Membuat background hanya seluas kontennya */
            padding: 8px;           /* Memberikan jarak di dalam background */
            border-radius: 4px;     /* Opsional: melengkungkan sudut */
        }

        .password-area label  {
            color: rgb(0, 0, 0);           /* Supaya teks kontras dengan warna biru */
        }

        .password-area label:hover {
            color: aliceblue;
        }

        .username-area label:hover {
            color: aliceblue;
        }

        .username-area input:hover{
            color: rgb(243, 240, 240);
            background-color: #3b4293;
        }

        .password-area input:hover{
            color: rgb(243, 240, 240);
            background-color: #3b4293;
        }

        .bca-info a {
            color: rgb(0, 0, 0);
        }

        a:hover {
            color: rgb(0, 0, 0);
        }

        button:hover {
            background-color: #2299aa;
        }

        .button {
            text-decoration: none;
        }

    </style>
</head>
<body>
    <!--<img src="dashboard.png" alt="dashboard" title="dashboard" >-->
    <h2>SEBAGAI KARYAWAN MBG SILAHKAN UNTUK LOGIN TERLEBIH DAHULU !</h2>
    <br><br><br>

    <div class="login-box">
        <div class="input-group username-area">
            <label>Username : </label>
            <input type="text" placeholder="Masukan nama anda">
        </div>

        <!-- Bungkus area password dengan class ini -->
        <div class="input-group password-area">
            <label>Password : </label>
            <input type="password" placeholder="Masukan password anda">
        </div>

        <div>
            <button class="btn bca-info"><a href="index.html">Login</a></button>
        </div>
    </div>

</body>
</html>
